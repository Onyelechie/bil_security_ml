server {
    listen 80;
    listen [::]:80;
    server_name example.com; # <-- replace with your domain

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com; # <-- replace with your domain

    # Path to the certificate and key (Let's Encrypt default). Replace as needed.
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Include recommended SSL params (TLS1.3 + TLS1.2 fallback)
    include /etc/nginx/ssl-params.conf;

    # Optional mTLS (uncomment to enable; requires CA cert file)
    # ssl_client_certificate /etc/nginx/certs/ca.crt;
    # ssl_verify_client on; # or "optional" to accept both

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer-when-downgrade;

    # Proxy to the application (uvicorn). If running behind Docker, replace with upstream name.
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 300;
        proxy_buffering off;
    }

    # Static file caching example (optional)
    location /static/ {
        alias /srv/bil/static/; # adjust to your deployment
        access_log off;
        expires 30d;
    }
}
