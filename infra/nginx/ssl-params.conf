# Recommended TLS settings (minimal, modern defaults).
# Adjust paths and ciphers to match your environment and OpenSSL version.

ssl_session_cache shared:SSL:10m;
ssl_session_timeout  10m;

ssl_protocols TLSv1.3 TLSv1.2;
# TLS1.3 ciphers are negotiated automatically; for TLS1.2 provide modern suites
ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
ssl_prefer_server_ciphers off;

# Enable stapling for OCSP
ssl_stapling on;
ssl_stapling_verify on;
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# Diffie-Hellman param (optional: generate with `openssl dhparam -out /etc/nginx/dhparam.pem 2048`)
# ssl_dhparam /etc/nginx/dhparam.pem;

# Security headers and options
ssl_session_tickets off;

# HSTS is already added per-site; additional hardening here if desired.
